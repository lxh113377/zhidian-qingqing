{% extends "base.html" %}
{% block title %}完成注册 · 门店管理助手{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <h1>完成注册</h1>
        <span class="chip">验证邮箱后自动创建商家与老板账号</span>
        <form method="POST" action="{{ url_for('auth.register_verify') }}" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="form-group">
                <label for="reg_email">邮箱</label>
                <input type="text" id="reg_email" class="form-control" value="{{ email }}" readonly>
            </div>
            <div class="form-group">
                <label for="code">验证码</label>
                <input type="text" name="code" id="code" class="form-control" required
                       inputmode="numeric" maxlength="6" placeholder="6 位数字"
                       autocomplete="one-time-code">
            </div>
            <div class="form-group">
                <label for="merchant_name">商家名称</label>
                <input type="text" name="merchant_name" id="merchant_name" class="form-control"
                       required maxlength="100" placeholder="例如：星辰餐饮">
            </div>
            <div class="form-group">
                <label for="username">老板账号</label>
                <input type="text" name="username" id="username" class="form-control" required
                       maxlength="50" placeholder="用于登录后台" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" name="password" id="password" class="form-control"
                       required minlength="8" placeholder="至少 8 位" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">创建商家账号</button>
        </form>
        <div class="login-hint">
            <p>没收到验证码？<a href="{{ url_for('auth.register') }}">重新发送</a></p>
            <p><a href="{{ url_for('auth.login') }}">返回登录</a></p>
        </div>
    </div>
</div>
{% endblock %}
