{% extends "base.html" %}
{% block title %}新增店员 · 门店管理助手{% endblock %}
{% block body_class %}is-admin{% endblock %}
{% block content %}
<div class="page-header">
    <a href="{{ url_for('admin.staff_list') }}" class="btn-back">← 返回店员列表</a>
    <h2>新增店员</h2>
</div>

<form method="POST" action="{{ url_for('admin.staff_add') }}" class="sales-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="username">登录账号</label>
        <input type="text" name="username" id="username" class="form-control" required placeholder="如 staff03">
    </div>
    <div class="form-group">
        <label for="password">初始密码</label>
        <input type="text" name="password" id="password" class="form-control" required placeholder="初始密码">
    </div>
    <div class="form-group">
        <label for="display_name">显示名</label>
        <input type="text" name="display_name" id="display_name" class="form-control" required placeholder="如 张三">
    </div>
    <div class="form-group">
        <label for="phone">电话（可选）</label>
        <input type="text" name="phone" id="phone" class="form-control" placeholder="选填">
    </div>
    <div class="form-group">
        <label for="store_name">所属门店</label>
        <input type="text" name="store_name" id="store_name" class="form-control" value="南昌·红谷滩店">
    </div>
    <button type="submit" class="btn btn-primary btn-block">保存店员</button>
</form>
{% endblock %}
